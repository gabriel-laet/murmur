[package]
name = "murmur"
version = "0.6.0"
edition = "2021"
description = "The communication kernel for AI agents — any agent, any harness; a directory of files, not a daemon"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
